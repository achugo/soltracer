services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soltracer
      POSTGRES_PASSWORD: soltracer
      POSTGRES_DB: soltracer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soltracer -d soltracer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
